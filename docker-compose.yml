name: runscope

x-python-service: &python-service
  build:
    context: .
    dockerfile: infra/docker/api.Dockerfile
  env_file:
    - path: .env
      required: false
  environment: &python-environment
    RUNSCOPE_DATABASE_URL: postgresql+asyncpg://runscope:runscope-local@postgres:5432/runscope
    RUNSCOPE_REDIS_URL: redis://redis:6379/0
    RUNSCOPE_BROKER_BOOTSTRAP_SERVERS: redpanda:9092
    RUNSCOPE_S3_ENDPOINT_URL: http://minio:9000
    RUNSCOPE_S3_ACCESS_KEY: runscope-local
    RUNSCOPE_S3_SECRET_KEY: runscope-local-only
    RUNSCOPE_S3_BUCKET: runscope-artifacts
    RUNSCOPE_ARTIFACT_BACKEND: local
    RUNSCOPE_LOCAL_ARTIFACT_DIR: /data/artifacts
    RUNSCOPE_JWT_SECRET: runscope-local-jwt-only
  depends_on:
    postgres:
      condition: service_healthy

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *python-service
    volumes:
      - artifact-data:/data/artifacts
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: runscope
      POSTGRES_USER: runscope
      POSTGRES_PASSWORD: runscope-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runscope -d runscope"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: runscope-local
      MINIO_ROOT_PASSWORD: runscope-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  artifact-data:
  postgres-data:
  minio-data:
